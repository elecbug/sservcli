services:
  builder:
    image: sservcli-builder:local
    profiles: [tools]
    build:
      context: .
      target: bundle
      args:
        WINDOWS_ARCH: ${WINDOWS_ARCH:-amd64}
        BUILD_CLIENT: ${BUILD_CLIENT:-1}
    network_mode: none
    read_only: true
    init: true
    environment:
      BUILD_CLIENT: ${BUILD_CLIENT:-1}
      WINDOWS_ARCH: ${WINDOWS_ARCH:-amd64}
      CLIENT_BINARIES: /opt/sservcli-client
      BUNDLE_INPUT: /input
      BUNDLE_OUTPUT: /output/${SSERVCLI_BUNDLE_NAME:-sservcli-windows-token.zip}
      BUNDLE_UID: ${SSERVCLI_BUNDLE_UID:-1000}
      BUNDLE_GID: ${SSERVCLI_BUNDLE_GID:-1000}
    volumes:
      - type: bind
        source: ${SSERVCLI_BUNDLE_INPUT:-./var/.bundle-input}
        target: /input
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SSERVCLI_BUNDLE_OUTPUT:-./dist}
        target: /output
    tmpfs:
      - /tmp
