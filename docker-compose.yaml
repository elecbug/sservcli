services:
  server:
    image: sservcli-server:local
    build:
      context: .
      target: server
      args:
        WINDOWS_ARCH: ${WINDOWS_ARCH:-amd64}
    network_mode: host
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    env_file:
      - path: ./var/docker.env
        required: false
    environment:
      CONFIG: /config/services.json
      SERVER_STATE: /state
      SSHD_CONFIG: /etc/ssh/sshd_config
      SSHD_PID_FILE: /run/sservcli/sshd.pid
      HOST_KEY_FILE: /state/ssh_host_ed25519.pub
      CLIENT_BINARIES: /opt/sservcli-client
      BUNDLE_OUTPUT: /dist/sservcli-windows-token.zip
    volumes:
      - type: bind
        source: ${SSERVCLI_CONFIG:-./var/services.windows.json}
        target: /config/services.json
        read_only: true
        bind:
          create_host_path: false
      - ./var/docker-server:/state
      - ./dist:/dist
    tmpfs:
      - /run
    healthcheck:
      test: ["CMD", "python3", "/opt/sservcli/server/container_runtime.py", "healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
