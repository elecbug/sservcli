[package]
name = "sservcli-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sservcli = { path = "../.." }

# Keep native UI dependencies out of the independently testable CLI workspace.
[workspace]
