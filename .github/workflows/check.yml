name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y openssh-server python3-tk xvfb
      - run: sudo mkdir -p /run/sshd
      - run: make check test integration
      - run: SSERVCLI_GUI_TESTS=1 xvfb-run -a python -m unittest discover -s tests -p test_desktop.py -v
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m sservcli check --config client/examples/services.windows.json
      - run: python -m unittest discover -s tests -p test_client.py -v
      - run: python -m unittest discover -s tests -p test_windows.py -v
      - run: python -m unittest discover -s tests -p test_desktop.py -v
        env:
          SSERVCLI_GUI_TESTS: '1'
      - run: cmd /c Build.cmd
