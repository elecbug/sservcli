name: Windows binaries
run-name: Windows binaries ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique ID supplied by make bundle
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: npm.cmd ci
        working-directory: client/desktop
      - run: cargo test --manifest-path client/desktop/src-tauri/Cargo.toml --locked
      - run: npm.cmd run build -- -- --locked
        working-directory: client/desktop
      - name: Stage native Windows binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force windows-binaries | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/sservcli.exe windows-binaries/
          Copy-Item client/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/sservcli-desktop.exe windows-binaries/
          @{ format = 1; commit = '${{ github.sha }}' } | ConvertTo-Json | Set-Content windows-binaries/build-info.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: sservcli-windows-binaries
          path: windows-binaries/
          if-no-files-found: error
